name: 정확도 확인
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 추적 시간(분)
        default: '60'
      script:
        description: accuracy(대기 예측) 또는 ridetime(탑승 시간 실측)
        default: accuracy
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 200 # 추적 시간 + 여유 (180분 추적이 180분 제한에 걸려 취소된 적 있음)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/${{ inputs.script }}.mjs ${{ inputs.minutes }}
