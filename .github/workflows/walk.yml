name: 걷는 길 갱신
on:
  schedule:
    - cron: '0 20 1 */3 *' # 석 달마다 2일 05:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-walk.mjs
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/walk.json
          git diff --cached --quiet || (git commit -m "데이터: 걷는 길(OpenStreetMap) 갱신" && git pull --rebase && git push)
