name: 시간표·노선 모양 갱신
on:
  schedule:
    - cron: '0 19 1 * *' # 매달 2일 04:00 KST (정류장·노선 갱신 1시간 뒤)
  workflow_dispatch:
    inputs:
      shapes_only:
        description: '노선 모양만 받기'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 사이트 중간 인증서 받기 (서버가 인증서 체인을 다 보내지 않아 Node가 거부함)
        run: |
          URI=$(echo | openssl s_client -connect bus.jeju.go.kr:443 -servername bus.jeju.go.kr 2>/dev/null | openssl x509 -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:.*' | sed 's/CA Issuers - URI://')
          echo "중간 인증서: $URI"
          curl -sSf "$URI" -o ca.der
          openssl x509 -inform DER -in ca.der -out ca.pem 2>/dev/null || cp ca.der ca.pem
          echo "NODE_EXTRA_CA_CERTS=$PWD/ca.pem" >> "$GITHUB_ENV"
      - run: node scripts/fetch-schedules.mjs
        if: ${{ !inputs.shapes_only }}
      - run: node --experimental-strip-types scripts/build-timetable.mjs
        if: ${{ !inputs.shapes_only }}
      - run: node scripts/fetch-shapes.mjs
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "데이터: 제주 버스 시간표·노선 모양 갱신" && git pull --rebase && git push)
