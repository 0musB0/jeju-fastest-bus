name: 시간표 갱신
on:
  schedule:
    - cron: '0 19 1 * *' # 매달 2일 04:00 KST (정류장·노선 갱신 1시간 뒤)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-schedules.mjs
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "데이터: 제주 버스 시간표 갱신" && git pull --rebase && git push)
